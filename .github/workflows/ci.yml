name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --non-interactive

      - name: Frontend tests
        run: yarn test --watchAll=false --runInBand
        env:
          CI: "true"
          DISABLE_EMERGENT_OVERLAY: "true"

      - name: Build
        run: yarn build

